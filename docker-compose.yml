services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hashscope-backend
    env_file:
      - .env
    ports:
      - "3333:3333"  # Proxy port for miners
      - "8000:8000"  # API port
    restart: unless-stopped
    networks:
      - hashscope

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hashscope-frontend
    env_file:
      - .env
    ports:
      - "3000:80"  # Web UI port
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hashscope

  # Agent service (Iteration 2)
  # Scale with: docker compose up -d --scale agent=3
  agent:
    build:
      context: ./agents
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - hashscope
    depends_on:
      - backend
    # By default, no agents run
    # Use --scale agent=N to run N agents
    deploy:
      replicas: 0

networks:
  hashscope:
    driver: bridge

